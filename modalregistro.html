<div class="backdrop is-hidden" id="data-modal">
                <div class="modal">
                    <button class="btn-modal" id="data-modal-close">
                        <svg class="icon-x">
                            <use href="#icon-x"></use>
                        </svg>
                    </button>
                    <p >Deje sus datos, nos contactaremos con usted</p>
                    <form class="modal-form" action="">
                        <label class="label-name">
                            Nombre
                            <input class="input-modal" type="text" name="name" />
                            <svg class="svg-name">
                                <use href="#icon-name"></use>
                            </svg>
                        </label>
                        <label class="label-name">
                            Teléfono
                            <input class="input-modal" type="tel" name="Teléfono" />
                            <svg class="svg-name">
                                <use href="#icon-fhone"></use>
                            </svg>
                        </label>
                        <label class="label-name">
                            E-mail
                            <input class="input-modal" type="email" name="email" />
                            <svg class="svg-name">
                                <use href="#icon-mail"></use>
                            </svg>
                        </label>
                        <label class="label-name">
                            Comentarios
                            <textarea class="input-tex" type="textarea" name="textarea" cols="30" rows="10" placeholder="Introduzca el texto"></textarea>
                        </label>
                        <div class="container-group-check">
                            <label class="label-name-check">
                                <input type="checkbox" name="accept-terms" hidden  required />
                                <span class="custom-check">
                                    <svg class="svg-name-check">
                                        <use href="#icon-check"></use>
                                    </svg>
                                </span>
                                <span class="custom-text"> Estoy de acuerdo con el boletín informativo y acepto los Términos y Condiciones</span>
                            </label>
                        </div>
                        <button class="button-send" type="submit"><span>Enviar</span></button>
                    </form>
                </div>
            </div>
